<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Upload</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:480px;margin:0 auto;padding:16px}
  button{width:100%;font-size:20px;padding:22px;margin:8px 0;box-sizing:border-box;background:#111;color:#fff;border:0;border-radius:12px}
  button:disabled{background:#999}
  #list div{padding:8px 0;border-bottom:1px solid #ddd}
  .ok{color:green}.err{color:red}
</style>
</head>
<body>
<h2>Upload</h2>
<p>Select the photos in the order taken: front, barcode, nutrition facts. 3 photos per product.</p>
<input type="file" id="f" accept="image/*" multiple hidden>
<button id="pick">Upload photos</button>
<div id="list"></div>

<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
const URL_ = "https://lnlrvzrvitgnimhldnen.supabase.co";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxubHJ2enJ2aXRnbmltaGxkbmVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyMjM4NDYsImV4cCI6MjEwNjc5OTg0Nn0.XjirEPZHLOif_PWJcL3n9rBeqTf8MRZNg1nYv0XyI-0";
const KEY = "6b18e1c88bbd39f66d98c211";
const H = {apikey: ANON, Authorization: "Bearer " + ANON, "x-upload-key": KEY};

async function toCanvas(file) {
  const bmp = await createImageBitmap(file);
  const sc = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return c;
}
const blobOf = c => new Promise(r => c.toBlob(r, "image/jpeg", 0.85));

async function readBarcode(c) {
  try {
    if ("BarcodeDetector" in window) {
      const r = await new BarcodeDetector().detect(c);
      if (r.length) return r[0].rawValue;
    }
  } catch (e) {}
  try {
    const hints = new Map();
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
    const res = await new ZXing.BrowserMultiFormatReader(hints).decodeFromImageUrl(c.toDataURL("image/jpeg", 0.9));
    return res.getText();
  } catch (e) { return null; }
}

async function upload(blob, name) {
  const r = await fetch(`${URL_}/storage/v1/object/partner-uploads/${name}`, {
    method: "POST", headers: {...H, "Content-Type": "image/jpeg"}, body: blob
  });
  if (!r.ok) throw new Error("upload " + r.status + " " + await r.text());
}

const f = document.getElementById("f"), pick = document.getElementById("pick"), list = document.getElementById("list");
pick.onclick = () => f.click();

f.onchange = async () => {
  // oldest photo first = the order they were taken
  const files = [...f.files].sort((a, b) => a.lastModified - b.lastModified || a.name.localeCompare(b.name));
  f.value = "";
  if (!files.length) return;
  if (files.length % 3 !== 0) {
    const row = document.createElement("div");
    row.className = "err";
    row.textContent = `✗ You selected ${files.length} photos. Select a multiple of 3 (front, barcode, nutrition per product).`;
    list.prepend(row);
    return;
  }
  pick.disabled = true;
  for (let i = 0; i < files.length; i += 3) {
    const n = i / 3 + 1, total = files.length / 3;
    const row = document.createElement("div");
    row.textContent = `Product ${n}/${total}: uploading…`;
    list.prepend(row);
    try {
      const trio = files.slice(i, i + 3);
      const canvases = await Promise.all(trio.map(toCanvas));
      const blobs = await Promise.all(canvases.map(blobOf));
      const bc = await readBarcode(canvases[1]);
      const id = crypto.randomUUID();
      const names = ["front", "barcode", "nutrition"].map(k => `${id}-${k}.jpg`);
      for (let j = 0; j < 3; j++) await upload(blobs[j], names[j]);
      const r = await fetch(`${URL_}/rest/v1/partner_products`, {
        method: "POST", headers: {...H, "Content-Type": "application/json", Prefer: "return=minimal"},
        body: JSON.stringify({id, front_path: names[0], barcode_path: names[1], nutrition_path: names[2], barcode_client: bc})
      });
      if (!r.ok) throw new Error("db " + r.status + " " + await r.text());
      row.className = "ok";
      row.textContent = `✓ Product ${n}/${total} sent` + (bc ? ` (barcode ${bc})` : "");
    } catch (e) {
      row.className = "err"; row.textContent = `✗ Product ${n}/${total} failed: ` + e.message;
    }
  }
  pick.disabled = false;
};
</script>
</body>
</html>
