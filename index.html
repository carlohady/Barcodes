<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Upload product photos</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:480px;margin:0 auto;padding:16px}
  button,input[type=text]{width:100%;font-size:18px;padding:14px;margin:8px 0;box-sizing:border-box}
  #list div{padding:6px 0;border-bottom:1px solid #ddd}
  .ok{color:green}.err{color:red}
</style>
</head>
<body>
<h2>Upload product photos</h2>
<input type="file" id="f" accept="image/*" capture="environment" multiple hidden>
<button id="pick">📷 Take photo(s)</button>
<input type="text" id="note" placeholder="Note (optional)">
<div id="list"></div>

<script>
const URL_ = "https://lnlrvzrvitgnimhldnen.supabase.co";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxubHJ2enJ2aXRnbmltaGxkbmVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyMjM4NDYsImV4cCI6MjEwNjc5OTg0Nn0.XjirEPZHLOif_PWJcL3n9rBeqTf8MRZNg1nYv0XyI-0";
const KEY = "6b18e1c88bbd39f66d98c211";
const H = {apikey: ANON, Authorization: "Bearer " + ANON, "x-upload-key": KEY};

const f = document.getElementById("f"), list = document.getElementById("list");
document.getElementById("pick").onclick = () => f.click();

f.onchange = async () => {
  const note = document.getElementById("note").value.trim() || null;
  for (const file of f.files) {
    const row = document.createElement("div");
    row.textContent = "Uploading " + file.name + "…";
    list.prepend(row);
    try {
      const ext = (file.name.split(".").pop() || "jpg").toLowerCase();
      const path = Date.now() + "-" + Math.random().toString(36).slice(2, 8) + "." + ext;
      let r = await fetch(`${URL_}/storage/v1/object/partner-uploads/${path}`, {
        method: "POST", headers: {...H, "Content-Type": file.type || "image/jpeg"}, body: file
      });
      if (!r.ok) throw new Error("storage " + r.status + " " + await r.text());
      r = await fetch(`${URL_}/rest/v1/partner_uploads`, {
        method: "POST", headers: {...H, "Content-Type": "application/json", Prefer: "return=minimal"},
        body: JSON.stringify({photo_path: path, note})
      });
      if (!r.ok) throw new Error("db " + r.status + " " + await r.text());
      row.className = "ok"; row.textContent = "✓ Sent " + file.name;
    } catch (e) {
      row.className = "err"; row.textContent = "✗ Failed: " + e.message;
    }
  }
  f.value = "";
};
</script>
</body>
</html>
